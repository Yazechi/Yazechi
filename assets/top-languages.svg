<svg xmlns="http://www.w3.org/2000/svg" width="420" height="248" viewBox="0 0 420 248" role="img" aria-label="Most used languages for Yazechi">
<style>
  .bg{fill:#ffffff;stroke:#d0d7de}
  .title{font:600 18px 'Segoe UI',Ubuntu,Arial,sans-serif;fill:#0969da}
  .label{font:400 14px 'Segoe UI',Ubuntu,Arial,sans-serif;fill:#57606a}
  .value{font:600 14px 'Segoe UI',Ubuntu,Arial,sans-serif;fill:#1f2328}
  .track{fill:#eaeef2}
  @media (prefers-color-scheme: dark){
    .bg{fill:#0d1117;stroke:#30363d}
    .title{fill:#58a6ff}
    .label{fill:#8b949e}
    .value{fill:#e6edf3}
    .track{fill:#21262d}
  }
</style>
<rect class="bg" x="0.5" y="0.5" width="419" height="247" rx="6"/>
<text class="title" x="24" y="36">Most Used Languages</text>
<rect class="track" x="24" y="50" width="372" height="8" rx="4"/>
<rect x="24.0" y="50" width="163.7" height="8" fill="#f1e05a"/>
<rect x="187.7" y="50" width="131.0" height="8" fill="#4f5d95"/>
<rect x="318.7" y="50" width="30.4" height="8" fill="#563d7c"/>
<rect x="349.1" y="50" width="29.6" height="8" fill="#e34c26"/>
<rect x="378.7" y="50" width="15.4" height="8" fill="#178600"/>
<rect x="394.1" y="50" width="1.9" height="8" fill="#8b949e"/>
<circle cx="30" cy="85" r="5" fill="#f1e05a"/>
<text class="label" x="44" y="90">JavaScript</text>
<text class="value" x="396" y="90" text-anchor="end">43.8%</text>
<circle cx="30" cy="113" r="5" fill="#4f5d95"/>
<text class="label" x="44" y="118">PHP</text>
<text class="value" x="396" y="118" text-anchor="end">35.1%</text>
<circle cx="30" cy="141" r="5" fill="#563d7c"/>
<text class="label" x="44" y="146">CSS</text>
<text class="value" x="396" y="146" text-anchor="end">8.1%</text>
<circle cx="30" cy="169" r="5" fill="#e34c26"/>
<text class="label" x="44" y="174">HTML</text>
<text class="value" x="396" y="174" text-anchor="end">7.9%</text>
<circle cx="30" cy="197" r="5" fill="#178600"/>
<text class="label" x="44" y="202">C#</text>
<text class="value" x="396" y="202" text-anchor="end">4.1%</text>
<circle cx="30" cy="225" r="5" fill="#8b949e"/>
<text class="label" x="44" y="230">Hack</text>
<text class="value" x="396" y="230" text-anchor="end">0.5%</text>
</svg>